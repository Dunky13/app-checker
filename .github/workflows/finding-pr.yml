name: Finding pull request

# A finding sent from the app arrives as an issue titled "Finding: …" or "Findings: …". This writes it to a draft
# pull request that closes the issue. The index stays unsigned: pull requests never get a signing key.
# Merging it publishes it, because CI signs the index on main. The maintainer can instead accept it with
# scripts/accept-finding.py <issue number>, which runs the tests, signs locally and marks it ready.
on:
  issues:
    types: [opened, edited, reopened]

permissions: {}

concurrency:
  group: finding-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  draft:
    # Also when an edit retitles a finding issue: its pull request then goes back to draft. The script checks the exact case.
    if: >-
      startsWith(github.event.issue.title, 'Finding: ') || startsWith(github.event.issue.title, 'Findings: ')
      || startsWith(github.event.changes.title.from, 'Finding')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      # The workflow and the script come from main. Nothing from the issue is run: the script reads it from the event file.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 scripts/accept-finding.py --draft "$GITHUB_EVENT_PATH"
        env:
          GH_TOKEN: ${{ github.token }}
