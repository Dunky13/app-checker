name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # On main only: when a merge changed findings/ without signing the index, sign it with the findings key and push that.
  # The key is a secret of the findings-signing environment, which only main can use. Pull requests never see it.
  sign:
    if: github.event_name == 'push'
    runs-on: macos-15
    environment: findings-signing
    permissions:
      contents: write
    concurrency:
      group: findings-signing
    outputs:
      sha: ${{ steps.sign.outputs.sha }}
    steps:
      # The tip of main, not the pushed commit: a run that waited for an earlier one signs on top of what that one pushed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      # Without the key: the tests run code that reads the environment.
      - id: check
        run: |
          if swift test --filter indexIsSignedAndListsEveryFile; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            # The findings must pass every other test first: what they reject is never signed.
            GITHUB_EVENT_NAME=pull_request swift test
          fi
      - if: steps.check.outputs.signed != 'true'
        env:
          FINDINGS_SIGNING_KEY: ${{ secrets.FINDINGS_SIGNING_KEY }}
        run: |
          KEY="$RUNNER_TEMP/findings.key"
          trap 'rm -f "$KEY"' EXIT
          (umask 077 && printf '%s' "$FINDINGS_SIGNING_KEY" > "$KEY")
          SPARKLE_KEY_FILE="$KEY" scripts/sign-findings.sh
      # Already signed, the tip of main is what the test job checks, even when it is later than this run's commit.
      - id: sign
        run: |
          if [[ "${{ steps.check.outputs.signed }}" == true ]]; then
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          swift test --filter indexIsSignedAndListsEveryFile
          git config user.name "github-actions[bot]"
          git config user.email "41898828+github-actions[bot]@users.noreply.github.com"
          git add findings/index.json findings/index.json.sig
          git commit -s -m "Sign the findings index for $(git rev-parse --short HEAD)"
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  test:
    needs: sign
    # Also on pull requests, where sign is skipped.
    if: ${{ !failure() && !cancelled() }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.sign.outputs.sha || github.sha }}
      - run: swift --version
      # Unit tests, including validation of every finding below findings/.
      - run: swift test
      - run: swift build -c release
